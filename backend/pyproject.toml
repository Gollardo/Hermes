[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-finance"
version = "1.1.0"
description = "Self-hosted personal finance application"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "AGPL-3.0-or-later"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.137,<0.138",
    "greenlet>=3.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pynacl>=1.6.2,<2",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-report=term-missing"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
